# Insert map once in the existing nginx http block, outside both server blocks:
# map $http_upgrade $paca_connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name task.spacedo.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name task.spacedo.org;
    # Keep the existing shared certificate and its renewal configuration.
    ssl_certificate /etc/letsencrypt/live/tasknotes-pushgo-spacedo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasknotes-pushgo-spacedo/privkey.pem;
    client_max_body_size 100m;
    location ~ ^/api/v1/plugins/com\.selfcommand\.(tasknotes-webhook|pushgo-queue)/worker/control/?$ { return 404; }
    location ~ ^/api/v1/plugins/com\.selfcommand\.tasknotes-webhook/receive/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location ^~ /tasknotes/v1/ { return 410; }
    location / {
        proxy_pass http://127.0.0.1:18788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $paca_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
